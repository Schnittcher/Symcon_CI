name: Symcon module style

# Wiederverwendbarer Workflow für die Stilprüfung. Module rufen ihn mit einer Zeile auf
# (siehe templates/module-style.yml). Die Prüfung ist dieselbe wie lokal: scripts/check.php --only=style.

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP-Version
        type: string
        default: '8.5'
      ci-ref:
        description: Tag oder Branch dieses Repositories, aus dem scripts/check.php geladen wird
        type: string
        default: v1

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Modul auschecken (mit Submodul .style)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Zentrale Prüfskripte laden
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Symcon_CI
          ref: ${{ inputs.ci-ref }}
          path: .ci

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}

      - name: php-cs-fixer v3 laden
        run: |
          wget -q https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer-v3.phar

      - name: Stil prüfen
        run: php .ci/scripts/check.php --only=style
